<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<title>Чаты — Sphere</title>
<link rel="icon" href="../assets/brand/logo-mark.png">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/messenger.css">
</head>
<body>
<div class="messenger-app">
  <aside class="chat-sidebar">
    <div class="chat-brand"><img src="../assets/brand/logo-mark.png" alt=""> <strong>Sphere</strong></div>
    <div class="sidebar-head">
      <div><div><span class="eyebrow-dot"></span> Мессенджер</div>
      <button class="btn-icon" data-logout title="Выйти"><span data-icon="arrow-from-bottom"></span></button></div>
      <button class="new-chat" data-new-chat><span data-icon="plus"></span><span>Новый чат</span></button>
    </div>
    <div class="chat-search"><span data-icon="search-alt"></span><input data-search placeholder="Поиск чатов"></div>
    <div class="list-label">Диалоги</div>
    <div class="conversation-list" data-conversation-list></div>
    <div class="sidebar-user" data-profile></div>
  </aside>

  <main class="chat-main">
    <header class="chat-header" data-chat-header>
      <div class="mobile-brand"><img src="../assets/brand/logo-mark.png" alt="">Sphere</div>
      <div class="chat-header-empty">Выберите диалог</div>
    </header>
    <section class="thread" data-thread>
      <div class="thread-empty">
        <div class="sphere-mark"><img src="../assets/brand/logo-mark.png" alt=""></div>
        <h1>Sphere</h1>
        <p>Выберите диалог или начните новый чат.</p>
        <button class="btn btn-primary" data-new-chat>Новый чат</button>
      </div>
    </section>
  </main>
</div>

<div class="modal-overlay" data-modal hidden>
  <div class="new-chat-modal">
    <div class="modal-head"><div><h2>Новый чат</h2><p>Найди пользователя по имени или @юзернейму.</p></div><button class="btn-icon" data-close>×</button></div>
    <div class="chat-search large"><span data-icon="search-alt"></span><input data-user-search placeholder="Например, @alex"></div>
    <div class="user-results" data-user-results><div class="empty-state">Начни вводить имя или юзернейм.</div></div>
  </div>
</div>
<script type="module" src="../js/pages/messenger.page.js"></script>
</body>
</html>
