<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Sphere</title>
  <link rel="icon" href="assets/brand/logo-mark.png" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/minimal.css" />
</head>
<body>
  <div class="auth-shell">
    <section class="auth-visual">
      <img src="assets/brand/bg-3.png" alt="" class="auth-bg" />
      <a href="login.html" class="brand">
        <img src="assets/brand/logo-mark.png" alt="Sphere" />
        Sphere
      </a>
      <div class="auth-copy">
        <h2>С возвращением в Sphere</h2>
        <p>Личные сообщения, файлы и быстрые чаты — в одном приватном пространстве.</p>
        <div class="auth-points">
          <div class="auth-point"><div class="feature-icon" data-icon="message-circle-dots"></div>Личные и групповые чаты</div>
          <div class="auth-point"><div class="feature-icon" data-icon="image-plus"></div>Фото и файлы в переписке</div>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-form-wrap">
        <h1>Вход</h1>
        <p>Рады видеть тебя снова. Введи данные аккаунта.</p>

        <form class="auth-form" data-login-form novalidate>
          <div class="field">
            <label for="email">Электронная почта</label>
            <div class="field-control">
              <span data-icon="envelope"></span>
              <input id="email" type="email" placeholder="example@mail.ru" autocomplete="email" required />
            </div>
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <div class="field-control">
              <span data-icon="lock-keyhole-open"></span>
              <input id="password" type="password" placeholder="Введите пароль" autocomplete="current-password" required />
              <button type="button" class="password-toggle" data-toggle-password aria-label="Показать пароль">
                <span data-icon="scan"></span>
              </button>
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end">
            <button type="button" class="muted-link" data-forgot style="color:var(--accent-400);font-size:0.85rem">Забыли пароль?</button>
          </div>
          <p class="field-error" data-form-error></p>
          <button type="submit" class="btn btn-primary auth-submit" data-submit-btn>Войти</button>
        </form>

        <p class="auth-footer-note">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
      </div>
    </section>
  </div>

  <script type="module" src="js/pages/login.page.js"></script>
</body>
</html>
